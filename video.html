<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Decorado</title>
    <link rel="stylesheet" href="assets/css/video.css">
</head>
<body>

    <div class="background-pink">
        <img src="assets/img/guirnalda-corazones.png" class="garland" alt="Guirnalda">

        <div class="monitor-container">
            <img src="assets/img/image-removebg-preview.png" class="ribbon" alt="Moño">

            <div class="imac-body">
                <div class="screen-frame">
                    <video class="screen-content" autoplay muted loop>
                        <source src="video/paisaje.mp4" type="video/mp4">
                        </video>
                </div>
                <div class="imac-stand"></div>
            </div>

            <img src="assets/img/image-removebg-preview (3).png" class="side-hearts" alt="Corazones">
        </div>

        <button 
            class="btn-continue" 
            onclick="window.location.href='index.html#options'">
            continuar --->
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
